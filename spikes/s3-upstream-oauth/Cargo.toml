[package]
name = "spike-s3-upstream-oauth"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest", "auth"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
wiremock = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
oauth2 = "5"
