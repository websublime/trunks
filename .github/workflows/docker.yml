name: docker

# Container images, from the two targets of the Dockerfile:
#   ghcr.io/<owner>/trunks:<version>        distroless — upstreams over HTTP
#   ghcr.io/<owner>/trunks:<version>-stdio  with Node.js and uv — stdio upstreams too
#
# - Pull requests that touch the image files, and manual runs: build both targets on amd64
#   and arm64 (native runners) and smoke-test them. Nothing is pushed.
# - Version tags (the ones that also trigger the release workflow): the same, then push
#   and publish the multi-architecture tags. `latest` / `latest-stdio` move only on final
#   releases, not on pre-releases such as v1.0.0-rc.1.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "web/app/**"
      - "crates/trunks-dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Both targets come from the same build stage, compiled once per architecture.
      - name: Build the distroless image
        run: docker buildx build --load --target distroless --tag trunks:test .
      - name: Build the stdio image
        run: docker buildx build --load --target stdio --tag trunks:test-stdio .

      - name: Smoke test
        run: |
          set -euo pipefail
          for image in trunks:test trunks:test-stdio; do
            echo "::group::$image"
            docker run --rm "$image" --version
            # Neither image runs as root.
            user="$(docker inspect --format '{{.Config.User}}' "$image")"
            test -n "$user" && test "$user" != "root" && test "$user" != "0"
            # The server starts, creates its SQLite database in /data and answers.
            container="$(docker run --detach --publish 127.0.0.1:8080:8080 "$image")"
            healthy=no
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
                healthy=yes
                break
              fi
              sleep 1
            done
            docker logs "$container" 2>&1 | tail -n 20
            # Development mode is the default: the registry answers without a token.
            curl --fail --silent --show-error http://127.0.0.1:8080/api/v0/servers
            # The console is embedded in the binary: its first page is served.
            curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet "<title>Overview · Trunks</title>"
            # SIGTERM stops it cleanly.
            docker stop --time 20 "$container" >/dev/null
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = "0"
            docker rm "$container" >/dev/null
            test "$healthy" = "yes"
            echo "::endgroup::"
          done
          # What the stdio image adds.
          docker run --rm --entrypoint node trunks:test-stdio --version
          docker run --rm --entrypoint npx trunks:test-stdio --version
          docker run --rm --entrypoint uvx trunks:test-stdio --version
          docker run --rm --entrypoint python3 trunks:test-stdio --version

      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the images of this architecture
        if: github.event_name == 'push'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          docker tag trunks:test "$IMAGE:$version-$ARCH"
          docker tag trunks:test-stdio "$IMAGE:$version-stdio-$ARCH"
          docker push "$IMAGE:$version-$ARCH"
          docker push "$IMAGE:$version-stdio-$ARCH"

  publish:
    name: publish multi-architecture tags
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifests
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          plain=("$version")
          stdio=("$version-stdio")
          if [[ "$version" != *-* ]]; then
            plain+=("latest")
            stdio+=("latest-stdio")
          fi
          for tag in "${plain[@]}"; do
            docker buildx imagetools create --tag "$IMAGE:$tag" \
              "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          done
          for tag in "${stdio[@]}"; do
            docker buildx imagetools create --tag "$IMAGE:$tag" \
              "$IMAGE:$version-stdio-amd64" "$IMAGE:$version-stdio-arm64"
          done
