name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trunks
          POSTGRES_PASSWORD: trunks
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trunks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUNKS_TEST_PG_URL: postgres://trunks:trunks@127.0.0.1:5432/postgres
      TRUNKS_TEST_REQUIRE_PG: "1" # the PostgreSQL cells must run here, never skip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p trunks-db
      # Conformance matrix {development, enterprise} × {sqlite, postgres} against the binary.
      - run: cargo test -p trunks --test conformance

  # The web console: type check, unit tests and build (`cargo xtask build-dashboard`), then
  # browser smoke tests against the real binary with the build embedded.
  web:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "^22.23.4"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: cargo xtask build-dashboard
      - run: cargo build --package trunks --package trunks-testing
      - name: Browser smoke tests
        working-directory: web/app
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-smoke-results
          path: web/app/test-results
          retention-days: 7
