[package]
name = "trunks-core"
description = "Trunks domain: registry, catalog, gateway, sessions, identity, OAuth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Derives `ts_rs::TS` on the dashboard types; used by `cargo xtask gen-types` only.
ts = ["dep:ts-rs", "trunks-types/ts"]

[dependencies]
trunks-types = { workspace = true }
ts-rs = { workspace = true, optional = true }
snafu = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
prometheus-client = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
oauth2 = { workspace = true }
jsonwebtoken = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
process-wrap = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
trunks-testing = { path = "../trunks-testing" }
tokio = { workspace = true }

[lints]
workspace = true
